
name: SIP Approval Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare SIP fingerprint
    runs-on: ubuntu-latest

    outputs:
      sip_hash: ${{ steps.fingerprint.outputs.sip_hash }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Calculate SIP fingerprint
        id: fingerprint
        shell: bash
        run: |
          SIP="docs/plans/2-add-an-export-command.md"
          HASH=$(sha256sum "$SIP" | cut -d ' ' -f1)
          echo "sip_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "SIP: $SIP"
          echo "SHA-256: $HASH"

  approval:
    name: Test human approval
    needs: prepare
    runs-on: ubuntu-latest
    environment: sip-approval-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify approved SIP fingerprint
        shell: bash
        env:
          EXPECTED_HASH: ${{ needs.prepare.outputs.sip_hash }}
        run: |
          SIP="docs/plans/2-add-an-export-command.md"
          ACTUAL_HASH=$(sha256sum "$SIP" | cut -d ' ' -f1)

          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "SIP fingerprint mismatch!"
            exit 1
          fi

          echo "SIP fingerprint verified!"

      - name: Confirm approval
        run: echo "Human approval checkpoint passed!"
